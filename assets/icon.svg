<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    rect { fill: #1b1b1b; }
    @media (prefers-color-scheme: dark) { rect { fill: #e6e6e6; } }
  </style>
  <mask id="leaf" style="mask-type: alpha">
    <image width="128" height="128" href="data:image/png;base64,"/>
