<button type="button" class="theme-toggle" aria-label="Dark mode" aria-pressed="false" hidden>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>
<script>
  /* Light / dark toggle. Inline on purpose: the button only appears once this
     runs, so keeping it in the page means it can never go missing because a
     separate script file failed to load. The site starts in light mode; a
     click flips the look (cross-fading where the browser supports it) and
     remembers the choice. */
  (function () {
    var root = document.documentElement;
    var button = document.querySelector(".theme-toggle");
    if (!button) return;

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function isDark() {
      return root.getAttribute("data-theme") === "dark";
    }

    function sync() {
      button.setAttribute("aria-pressed", isDark() ? "true" : "false");
    }

    button.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      try { localStorage.setItem("theme", next); } catch (e) {}

      function apply() {
        root.setAttribute("data-theme", next);
        sync();
      }

      if (!document.startViewTransition || reduceMotion.matches) {
        apply();
        return;
      }
      root.classList.add("theme-changing");
      document.startViewTransition(apply).finished.finally(function () {
        root.classList.remove("theme-changing");
      });
    });

    button.hidden = false;
    sync();
  })();
</script>
