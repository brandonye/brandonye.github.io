<header class="site-header">
  {% if page.banner == "full" %}
  <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
  {% else %}
  <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
  {% endif %}
  <nav class="site-nav" aria-label="Main">
    <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a>
    <a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing/' %} aria-current="page"{% endif %}>Writing</a>
    {% if site.cv %}<a href="{{ site.cv | relative_url }}">CV</a>{% endif %}
  </nav>
</header>
