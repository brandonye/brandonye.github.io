<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<script>
  /* Apply a saved light/dark choice before the page paints, so it never flashes. */
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
  /* Pulling past the top of the page shows black, continuing the banner;
     pulling past the bottom shows the page colour (see site.css). On a page
     that fits on one screen you're at the top and the bottom at once, so the
     direction of your last scroll (wheel, trackpad or finger) decides which
     edge you're pulling at. */
  (function () {
    var root = document.documentElement;
    var goingUp = true;
    function edge() { root.classList.toggle("at-top", window.scrollY <= 0 && goingUp); }
    function heading(up) { if (up !== goingUp) { goingUp = up; edge(); } }
    edge();
    window.addEventListener("scroll", edge, { passive: true });
    window.addEventListener("wheel", function (e) {
      if (e.deltaY) heading(e.deltaY < 0);
    }, { passive: true });
    var touchY = null;
    window.addEventListener("touchstart", function (e) {
      touchY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener("touchmove", function (e) {
      if (touchY === null) return;
      var dy = e.touches[0].clientY - touchY;
      if (dy) heading(dy > 0); // finger moving down pulls the page down: going up
    }, { passive: true });
  })();
</script>
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
<!-- The 葉 leaf icon. Browsers that read SVG icons use icon.svg, which turns
     light when the browser is in dark mode; others use favicon.ico. -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
<link rel="icon" href="{{ '/assets/icon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<title>{{ site.title }}</title>
