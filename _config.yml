# ---------------------------------------------------------------
# Site settings. Edit the values in this first block.
# ---------------------------------------------------------------
title: Brandon Ye
# Left empty on purpose: otherwise GitHub fills in the repo description and
# the home page's browser tab reads "Brandon Ye | <description>".
description: ""
url: "https://brandonye.github.io"
baseurl: ""
lang: en

author:
  name: Brandon Ye
  # How your name is written in author lists. It is shown in bold there.
  short_name: "Ye B"
  email: brandonye89@gmail.com

links:
  scholar: "https://scholar.google.com/citations?user=ZhQE70YAAAAJ&hl=en"
  linkedin: "https://www.linkedin.com/in/brandonye/"
  # x: "https://x.com/brndnye"   # hidden for now; uncomment to show X on the home page

# Your CV. Hidden for now: to show the CV link again, uncomment the line
# below and remove `assets/cv.pdf` from .gitignore so the file is published.
# cv: /assets/cv.pdf

# ---------------------------------------------------------------
# Build settings. You shouldn't need to change these.
# ---------------------------------------------------------------
repository: brandonye/brandonye.github.io
theme: null # no GitHub default theme; this site has its own layouts
permalink: /writing/:year/:title/
markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - docs/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache/
