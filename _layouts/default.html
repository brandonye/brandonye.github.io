<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>
{% include banner.html %}
<div class="container">
{% include nav.html %}
<main id="content">
{{ content }}
</main>
</div>
<button class="to-top" type="button" aria-label="Back to top">
  <img src="{{ '/assets/leaf-green.png' | relative_url }}" alt="" width="26" height="26">
  <span class="to-top-label" aria-hidden="true">Back to top</span>
</button>
<script>
  /* The leaf in the bottom-right corner. It shows only on pages whose content
     runs past the bottom of the screen, once you've scrolled down a little,
     and glides back to the top when clicked (without changing the address). */
  (function () {
    var btn = document.querySelector(".to-top");
    var main = document.querySelector("main");
    var root = document.documentElement;
    if (!btn || !main) return;
    /* "Room to scroll" means the content itself (not the empty space below
       it) runs past the screen, measured at its smallest, with a phone
       browser's toolbars showing, so the answer doesn't flip as they slide
       away. Re-checked when the content or the window changes size. */
    var viewport = document.createElement("div");
    viewport.setAttribute("aria-hidden", "true");
    viewport.style.cssText = "position:fixed;top:0;left:0;width:0;height:100vh;height:100svh;visibility:hidden;pointer-events:none";
    document.body.appendChild(viewport);
    function checkLength() {
      var last = main.lastElementChild;
      var contentEnd = last ? last.getBoundingClientRect().bottom + window.scrollY : 0;
      root.classList.toggle("long-page", contentEnd > viewport.offsetHeight);
    }
    function checkScroll() { root.classList.toggle("scrolled", window.scrollY > 40); }
    /* The label unfolds to exactly its own width (site.css reads --label-w),
       so the leaf's slide lasts the whole animation instead of finishing
       early on its way to a wider maximum. */
    var label = btn.querySelector(".to-top-label");
    function measureLabel() { btn.style.setProperty("--label-w", label.scrollWidth + "px"); }
    function checkAll() { checkLength(); measureLabel(); }
    checkAll();
    checkScroll();
    window.addEventListener("scroll", checkScroll, { passive: true });
    window.addEventListener("resize", checkAll);
    window.addEventListener("load", checkAll);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(checkAll);
    if (window.ResizeObserver) new ResizeObserver(checkLength).observe(main);

    /* The glide: easing in and out, a little longer for longer pages.
       Scrolling, touching or pressing a key on the way stops it. Visitors
       who ask for reduced motion jump straight to the top. */
    function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
    btn.addEventListener("click", function () {
      var start = window.scrollY;
      if (start <= 0) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        window.scrollTo(0, 0);
        return;
      }
      var duration = Math.min(1300, 650 + start * 0.3);
      var t0 = null, stopped = false;
      function stop() { stopped = true; }
      var events = ["wheel", "touchstart", "keydown"];
      events.forEach(function (e) { window.addEventListener(e, stop, { passive: true }); });
      root.style.scrollBehavior = "auto"; // the page's own smooth scrolling would fight each step
      function finish() {
        events.forEach(function (e) { window.removeEventListener(e, stop); });
        root.style.scrollBehavior = "";
      }
      function step(now) {
        if (stopped) return finish();
        if (t0 === null) t0 = now;
        var p = Math.min(1, (now - t0) / duration);
        window.scrollTo(0, start * (1 - ease(p)));
        if (p < 1) requestAnimationFrame(step); else finish();
      }
      requestAnimationFrame(step);
    });
  })();
</script>
</body>
</html>
