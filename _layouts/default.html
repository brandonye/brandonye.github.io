<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>
{% include banner.html %}
<div class="container">
{% include nav.html %}
<main id="content">
{{ content }}
</main>
<footer class="site-footer">
  <button class="seal" type="button" aria-label="Back to top">
    <span class="seal-leaf" aria-hidden="true">
      <svg viewBox="0 0 1255 1255" focusable="false"><use href="{{ '/assets/leaf.svg#leaf' | relative_url }}"></use></svg>
      <img src="{{ '/assets/leaf-green.png' | relative_url }}" alt="" width="20" height="20" loading="lazy" decoding="async">
    </span>
    <span class="seal-label" aria-hidden="true">Back to top</span>
  </button>
</footer>
<script>
  /* The leaf glides back to the top (without adding "#top" to the address):
     easing in and out, a little longer for longer pages. Scrolling, touching
     or pressing a key on the way stops it. Visitors who ask for reduced
     motion jump straight to the top. */
  (function () {
    var seal = document.querySelector(".seal");
    var root = document.documentElement;
    if (!seal) return;
    /* Show the leaf only when the page's content (not the empty space below
       it) runs past the bottom of the screen. The screen is measured at its
       smallest, with a phone browser's toolbars showing, so the answer
       doesn't flip as they slide away. Re-checked when the content or the
       window changes size, and once fonts have loaded. */
    var main = document.querySelector("main");
    var viewport = document.createElement("div");
    viewport.setAttribute("aria-hidden", "true");
    viewport.style.cssText = "position:fixed;top:0;left:0;width:0;height:100vh;height:100svh;visibility:hidden;pointer-events:none";
    document.body.appendChild(viewport);
    function checkLength() {
      var last = main && main.lastElementChild;
      if (!last) return;
      var contentEnd = last.getBoundingClientRect().bottom + window.scrollY;
      root.classList.toggle("long-page", contentEnd > viewport.offsetHeight);
    }
    checkLength();
    window.addEventListener("resize", checkLength);
    window.addEventListener("load", checkLength);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(checkLength);
    if (window.ResizeObserver) new ResizeObserver(checkLength).observe(main);
    function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
    seal.addEventListener("click", function () {
      var start = window.scrollY;
      if (start <= 0) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        window.scrollTo(0, 0);
        return;
      }
      var duration = Math.min(1300, 650 + start * 0.3);
      var t0 = null, stopped = false;
      function stop() { stopped = true; }
      var events = ["wheel", "touchstart", "keydown"];
      events.forEach(function (e) { window.addEventListener(e, stop, { passive: true }); });
      root.style.scrollBehavior = "auto"; // the page's own smooth scrolling would fight each step
      function finish() {
        events.forEach(function (e) { window.removeEventListener(e, stop); });
        root.style.scrollBehavior = "";
      }
      function step(now) {
        if (stopped) return finish();
        if (t0 === null) t0 = now;
        var p = Math.min(1, (now - t0) / duration);
        window.scrollTo(0, start * (1 - ease(p)));
        if (p < 1) requestAnimationFrame(step); else finish();
      }
      requestAnimationFrame(step);
    });
  })();
</script>
</div>
</body>
</html>
